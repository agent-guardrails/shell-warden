name: ci

# Tests and linters for every pull request (P2 · CI: run tests and linters on
# PRs — https://github.com/agent-guardrails/shell-warden/issues/10):
# the Rust test suite, rustfmt, clippy, and actionlint for the workflows
# themselves. Merge is gated on green CI via branch protection on `main`.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: cargo test --all-features

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Format check
        run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, clippy)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint workflows
        uses: rhysd/actionlint@v1.7.12

  policy-battery:
    name: policy battery (examples/configs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout config v2 contract fixtures
        uses: actions/checkout@v4
        with:
          repository: agent-guardrails/docs
          ref: 9d8641b1711b733190def5d71dce3ea0e4589bba
          path: contract-docs
          persist-credentials: false
      - name: Install Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build checker
        run: cargo build --release
      - name: Run example-policy verdict battery
        env:
          SHELL_WARDEN_BIN: ${{ github.workspace }}/target/release/shell-warden
        run: node examples/configs/verdict-battery.cjs --config examples/configs/shell-warden.example.jsonc --battery examples/configs/example-battery.json
      - name: Run config v2 release conformance battery
        env:
          SHELL_WARDEN_BIN: ${{ github.workspace }}/target/release/shell-warden
        run: node tests/config-v2/run.cjs --fixtures contract-docs/schemas/fixtures/shell-warden.config.v2
