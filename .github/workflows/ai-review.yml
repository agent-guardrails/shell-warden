# Thin caller: drop this into every project repo as .github/workflows/ai-review.yml
name: AI Review

on:
  pull_request:

jobs:
  review:
    # Fork PRs receive no secrets, so the review cannot run there — skip silently.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: agent-guardrails/.github/.github/workflows/ai-review.yml@main
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
