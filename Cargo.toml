[package]
name = "shell-warden"
version = "0.1.0"
edition = "2021"
description = "Orchestrator engine of the shell-warden permission system: stage walk + tool invocations; decisions live in stage tools"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "shell-warden"
path = "src/main.rs"
