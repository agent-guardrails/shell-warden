[package]
name = "shell-warden"
version = "0.2.2"
edition = "2024"
description = "One-shot letter checker of the shell-warden permission system (rules grammar; per-check spawn per ADR-0016)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The release artifact: the one-shot letter checker (02-letter-verdict, ADR-0016).
# Spawned per check by the hook; no server, no long-lived process.
[[bin]]
name = "shell-warden"
path = "src/bin/shell-warden.rs"

# The M0 JSON-RPC orchestrator, superseded by ADR-0016 — kept as reference, never shipped.
[[bin]]
name = "shell-warden-serve"
path = "src/main.rs"

# Test-only stage tool for the runtime contract tests (never ships).
[[bin]]
name = "warden-test-tool"
path = "src/bin/warden-test-tool.rs"
