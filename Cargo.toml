[package]
name = "shell-warden"
version = "0.5.0"
edition = "2024"
description = "One-shot letter checker of the shell-warden permission system (config v2 command profiles; per-check spawn per ADR-0016)"
license = "MIT"

[workspace]
members = ["sw-attrs"]

[dependencies]
sw-attrs = { path = "sw-attrs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `re2-v1` dialect for the closed `regex` string-value selectors (ADR/design
# §Action-sensitive matching): the `regex` crate is an RE2-compatible engine —
# UTF-8 semantics, case-sensitive by default, no backreferences or look-around,
# linear time. Patterns are compiled once at config load
# (shell-warden pin: 1.13.x / lockfile) and match whole values only.
regex = "1.13"
# AST-level `re2-v1` dialect validation: the flags rejection walks the parsed
# AST (`regex-syntax` already backs `regex`), so hand-scanner ambiguity around
# character classes, POSIX classes and escapes is impossible.
regex-syntax = "0.8"

# The release artifact: the one-shot letter checker (02-letter-verdict, ADR-0016).
# Spawned per check by the hook; no server, no long-lived process.
[[bin]]
name = "shell-warden"
path = "src/bin/shell-warden.rs"

# The M0 JSON-RPC orchestrator, superseded by ADR-0016 — kept as reference, never shipped.
[[bin]]
name = "shell-warden-serve"
path = "src/main.rs"

# Test-only stage tool for the runtime contract tests (never ships).
[[bin]]
name = "warden-test-tool"
path = "src/bin/warden-test-tool.rs"
